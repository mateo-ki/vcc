name: Build and Release

# Triggers: pushing a v* tag -> build the installer and publish a GitHub Release;
# pushing to main (or a manual run) -> compile, run the gtest suites and the guards.
#
# Dependencies install in vcpkg's CLASSIC mode, the way the local tree does. CI's first two
# failures were both manifest-mode paperwork - a manifest without builtin-baseline, then a
# --depth 1 clone that did not contain the baseline commit - and neither is a property of
# this project. Pinning the vcpkg *commit* keeps the run reproducible without any baseline.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

env:
  # Named VCC_VCPKG on purpose: ilammy/msvc-dev-cmd exports VCPKG_ROOT pointing at the
  # vcpkg bundled inside Visual Studio, which silently takes over from the tree we clone
  # and cache here.
  VCC_VCPKG: ${{ github.workspace }}/../vcpkg-ci
  VCC_VCPKG_SHA: e456309491fd875487bf02b8a0dca76c1b1b00cc
  VCPKG_PORTS: libarchive nlohmann-json openssl qt6 unofficial-sqlite3 yaml-cpp zlib
  VCPKG_BINARY_SOURCES: files;${{ github.workspace }}/../vcpkg-cache;readwrite

jobs:
  # ---------------------------------------------------------------- compile + full tests
  test:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Cache the vcpkg tree and its archives
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCC_VCPKG }}
            ${{ github.workspace }}/../vcpkg-cache
          key: vcpkg-classic-${{ runner.os }}-${{ env.VCC_VCPKG_SHA }}-${{ env.VCPKG_PORTS }}

      - name: Set up MSVC + Ninja + CMake on PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg at the pinned commit
        shell: bash
        run: |
          git config --global core.longpaths true
          if [ ! -d "$VCC_VCPKG/.git" ]; then git clone https://github.com/microsoft/vcpkg "$VCC_VCPKG"; fi
          # Classic mode needs no baseline, so the pin is a nice-to-have: if the cached
          # clone cannot fetch that exact object, fall back to the tip instead of failing
          # the whole job over it.
          if git -C "$VCC_VCPKG" fetch --depth 1 origin "$VCC_VCPKG_SHA"; then
            git -C "$VCC_VCPKG" checkout --detach "$VCC_VCPKG_SHA"
          else
            echo "::warning::could not fetch vcpkg $VCC_VCPKG_SHA - continuing on the branch tip"
          fi
          "$VCC_VCPKG/bootstrap-vcpkg.bat" -disableMetrics

      - name: Install the dependencies
        shell: bash
        run: "$VCC_VCPKG/vcpkg.exe" install --triplet x64-windows $VCPKG_PORTS

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build-ninja -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCC_VCPKG/scripts/buildsystems/vcpkg.cmake" \
            -DVCC_BUILD_TESTS=ON

      - name: Build everything
        run: cmake --build build-ninja --parallel 8

      - name: Run the test suites
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_PLUGIN_PATH: ${{ github.workspace }}/../vcpkg-ci/installed/x64-windows/debug/Qt6/plugins
        run: ctest --test-dir build-ninja -j8 --output-on-failure

      - name: Static guards (layer boundaries, single colour source)
        shell: bash
        run: |
          node tools/check-decoupling.mjs
          node tools/check-hardcoded-colors.mjs

  # ---------------------------------------------------------------- installer + release
  installer:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCC_VCPKG }}
            ${{ github.workspace }}/../vcpkg-cache
          key: vcpkg-classic-${{ runner.os }}-${{ env.VCC_VCPKG_SHA }}-${{ env.VCPKG_PORTS }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg at the pinned commit
        shell: bash
        run: |
          git config --global core.longpaths true
          if [ ! -d "$VCC_VCPKG/.git" ]; then git clone https://github.com/microsoft/vcpkg "$VCC_VCPKG"; fi
          # Classic mode needs no baseline, so the pin is a nice-to-have: if the cached
          # clone cannot fetch that exact object, fall back to the tip instead of failing
          # the whole job over it.
          if git -C "$VCC_VCPKG" fetch --depth 1 origin "$VCC_VCPKG_SHA"; then
            git -C "$VCC_VCPKG" checkout --detach "$VCC_VCPKG_SHA"
          else
            echo "::warning::could not fetch vcpkg $VCC_VCPKG_SHA - continuing on the branch tip"
          fi
          "$VCC_VCPKG/bootstrap-vcpkg.bat" -disableMetrics

      - name: Install the dependencies
        shell: bash
        run: "$VCC_VCPKG/vcpkg.exe" install --triplet x64-windows $VCPKG_PORTS

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Locate ISCC
        shell: bash
        run: |
          for candidate in "/c/Program Files (x64)/Inno Setup 6/ISCC.exe" \
                           "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            if [ -f "$candidate" ]; then
              echo "ISCC=$(cygpath -w "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Inno Setup installed but ISCC.exe is still nowhere to be found"
          exit 1

      - name: The tag must match the version baked into the installer
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(grep -oE '#define +MyAppVersion +"[^"]+"' cmake/vcc.iss | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$want" != "$have" ]; then
            echo "::error::tag is v$want but MyAppVersion in cmake/vcc.iss is $have"
            exit 1
          fi

      - name: Build Release, prune dist, compile the installer
        shell: bash
        run: |
          cmake -S . -B build-rel -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="$VCC_VCPKG/scripts/buildsystems/vcpkg.cmake" \
            -DVCC_BUILD_TESTS=OFF
          node tools/package.mjs build-rel

      - uses: actions/upload-artifact@v4
        with:
          name: vcc-windows-installer
          path: build-rel/installer/*.exe
          if-no-files-found: error

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build-rel/installer/*.exe \
            --verify-tag --title "VCC $GITHUB_REF_NAME" --generate-notes

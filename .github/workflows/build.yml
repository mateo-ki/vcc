name: Build and Release

# Triggers: pushing a v* tag -> build the installer and publish a GitHub Release;
# pushing to main (or a manual run) -> compile, run the gtest suites and the guards.
#
# Dependencies install in vcpkg's CLASSIC mode, the way the local tree does. CI's first two
# failures were both manifest-mode paperwork - a manifest without builtin-baseline, then a
# --depth 1 clone that did not contain the baseline commit - and neither is a property of
# this project. Pinning the vcpkg *commit* keeps the run reproducible without any baseline.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

env:
  # Named VCC_VCPKG on purpose: ilammy/msvc-dev-cmd exports VCPKG_ROOT pointing at the
  # vcpkg bundled inside Visual Studio, which silently takes over from the tree we clone
  # and cache here.
  #
  # It also has to live *inside* the workspace: actions/cache silently refuses to save any
  # path outside GITHUB_WORKSPACE, and the previous layout (workspace/../vcpkg-ci) meant
  # this repo never stored a single cache entry - so every run paid a fresh ~1h Qt build.
  VCC_VCPKG: ${{ github.workspace }}/.ci/vcpkg
  VCC_VCPKG_SHA: e456309491fd875487bf02b8a0dca76c1b1b00cc
  # vcpkg has no `qt6` metaport any more (CI proved it: "ports/qt6: error: qt6 does not
  # exist"). The Qt6 modules this project finds are split ports: qtbase carries
  # Core/Gui/Widgets/Network/Concurrent, qtsvg carries Svg.
  # gtest is not optional here: tests/CMakeLists.txt line 1 is an unconditional
  # find_package(GTest CONFIG REQUIRED). It never shows up locally because the local vcpkg
  # tree has had gtest installed for months.
  VCPKG_PORTS: qtbase qtsvg libarchive nlohmann-json openssl sqlite3 yaml-cpp zlib gtest
  # Binary cache: sources are separated by ';', the fields *inside* one source by ','.
  # Writing `files;<path>;readwrite` makes vcpkg read "readwrite" as the path and fail the
  # whole install step with "binary config 'files' requires at least one path argument".
  VCPKG_BINARY_SOURCES: files,${{ github.workspace }}/.ci/vcpkg-cache,readwrite

jobs:
  # ---------------------------------------------------------------- compile + full tests
  test:
    runs-on: windows-2022
    timeout-minutes: 360
    # Commit comments are the only failure-output channel that is readable without
    # repository rights: job logs and check-run annotations both need them.
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache the vcpkg tree and its archives
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCC_VCPKG }}
            ${{ github.workspace }}/.ci/vcpkg-cache
          key: vcpkg-classic-${{ runner.os }}-${{ env.VCC_VCPKG_SHA }}-${{ env.VCPKG_PORTS }}
          # Adding a port changes the primary key. Without this prefix fallback that means
          # recompiling Qt6 from source for another hour; with it the previous tree is
          # restored and only the new port gets built.
          restore-keys: |
            vcpkg-classic-${{ runner.os }}-${{ env.VCC_VCPKG_SHA }}

      - name: Set up MSVC + Ninja + CMake on PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg at the pinned commit
        shell: bash
        run: |
          git config --global core.longpaths true
          if [ ! -d "$VCC_VCPKG/.git" ]; then git clone https://github.com/microsoft/vcpkg "$VCC_VCPKG"; fi
          # Classic mode needs no baseline, so the pin is a nice-to-have: if the cached
          # clone cannot fetch that exact object, fall back to the tip instead of failing
          # the whole job over it.
          if git -C "$VCC_VCPKG" fetch --depth 1 origin "$VCC_VCPKG_SHA"; then
            git -C "$VCC_VCPKG" checkout --detach "$VCC_VCPKG_SHA"
          else
            echo "::warning::could not fetch vcpkg $VCC_VCPKG_SHA - continuing on the branch tip"
          fi
          "$VCC_VCPKG/bootstrap-vcpkg.bat" -disableMetrics

      - name: Install the dependencies
        shell: bash
        # msvc-dev-cmd leaves VCPKG_ROOT pointing at the vcpkg bundled with Visual Studio;
        # a per-step env wins over what it wrote into $GITHUB_ENV.
        env:
          VCPKG_ROOT: ${{ env.VCC_VCPKG }}
        run: |
          set +e
          "$VCC_VCPKG/vcpkg.exe" version
          "$VCC_VCPKG/vcpkg.exe" install --triplet x64-windows $VCPKG_PORTS > install.log 2>&1
          status=$?
          tail -n 40 install.log
          # Job logs need repo admin rights; the annotation path is public, so quote the
          # failure into it.
          sh ci/annotate-fail.sh "$status" "vcpkg install" install.log
          exit $status

      - name: Configure
        shell: bash
        run: |
          set +e
          export VCPKG_ROOT="$VCC_VCPKG"
          cmake -S . -B build-ninja -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCC_VCPKG/scripts/buildsystems/vcpkg.cmake" \
            -DVCC_BUILD_TESTS=ON > configure.log 2>&1
          status=$?
          tail -n 40 configure.log
          sh ci/annotate-fail.sh "$status" "configure" configure.log
          exit $status

      - name: Build everything
        shell: bash
        run: |
          set +e
          cmake --build build-ninja --parallel 8 > build.log 2>&1
          status=$?
          tail -n 40 build.log
          sh ci/annotate-fail.sh "$status" "build" build.log
          exit $status

      - name: Run the test suites
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_PLUGIN_PATH: ${{ github.workspace }}/.ci/vcpkg/installed/x64-windows/debug/Qt6/plugins
        run: |
          set +e
          ctest --test-dir build-ninja -j8 --output-on-failure > tests.log 2>&1
          status=$?
          tail -n 60 tests.log
          sh ci/annotate-fail.sh "$status" "ctest" tests.log
          exit $status

      - name: Static guards (layer boundaries, single colour source)
        shell: bash
        run: |
          node tools/check-decoupling.mjs
          node tools/check-hardcoded-colors.mjs

      # Job logs need repository rights to download, so keep the per-step logs as an
      # artifact too - the annotation only carries the tail.
      - name: Attach the step logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-job-logs
          path: |
            install.log
            configure.log
            build.log
            tests.log

      - name: Publish the failure log where anyone can read it
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "## test job, run $GITHUB_RUN_ID ($GITHUB_SHA)";
            for f in install.log configure.log build.log tests.log; do
              [ -f "$f" ] || continue
              echo "===== $f ====="; tail -n 150 "$f"
            done; } > digest.md
          head -c 55000 digest.md > digest-body.md
          gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@digest-body.md > /dev/null && echo "failure log posted as a commit comment"

  # ---------------------------------------------------------------- installer + release
  installer:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCC_VCPKG }}
            ${{ github.workspace }}/.ci/vcpkg-cache
          key: vcpkg-classic-${{ runner.os }}-${{ env.VCC_VCPKG_SHA }}-${{ env.VCPKG_PORTS }}
          # Adding a port changes the primary key. Without this prefix fallback that means
          # recompiling Qt6 from source for another hour; with it the previous tree is
          # restored and only the new port gets built.
          restore-keys: |
            vcpkg-classic-${{ runner.os }}-${{ env.VCC_VCPKG_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg at the pinned commit
        shell: bash
        run: |
          git config --global core.longpaths true
          if [ ! -d "$VCC_VCPKG/.git" ]; then git clone https://github.com/microsoft/vcpkg "$VCC_VCPKG"; fi
          # Classic mode needs no baseline, so the pin is a nice-to-have: if the cached
          # clone cannot fetch that exact object, fall back to the tip instead of failing
          # the whole job over it.
          if git -C "$VCC_VCPKG" fetch --depth 1 origin "$VCC_VCPKG_SHA"; then
            git -C "$VCC_VCPKG" checkout --detach "$VCC_VCPKG_SHA"
          else
            echo "::warning::could not fetch vcpkg $VCC_VCPKG_SHA - continuing on the branch tip"
          fi
          "$VCC_VCPKG/bootstrap-vcpkg.bat" -disableMetrics

      - name: Install the dependencies
        shell: bash
        env:
          VCPKG_ROOT: ${{ env.VCC_VCPKG }}
        run: |
          set +e
          "$VCC_VCPKG/vcpkg.exe" version
          "$VCC_VCPKG/vcpkg.exe" install --triplet x64-windows $VCPKG_PORTS > install.log 2>&1
          status=$?
          tail -n 40 install.log
          sh ci/annotate-fail.sh "$status" "vcpkg install (installer job)" install.log
          exit $status

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Locate ISCC
        shell: bash
        run: |
          for candidate in "/c/Program Files (x64)/Inno Setup 6/ISCC.exe" \
                           "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            if [ -f "$candidate" ]; then
              echo "ISCC=$(cygpath -w "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Inno Setup installed but ISCC.exe is still nowhere to be found"
          exit 1

      - name: The tag must match the version baked into the installer
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(grep -oE '#define +MyAppVersion +"[^"]+"' cmake/vcc.iss | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$want" != "$have" ]; then
            echo "::error::tag is v$want but MyAppVersion in cmake/vcc.iss is $have"
            exit 1
          fi

      - name: Build Release, prune dist, compile the installer
        shell: bash
        run: |
          set +e
          export VCPKG_ROOT="$VCC_VCPKG"
          {
            cmake -S . -B build-rel -G "Visual Studio 17 2022" -A x64 \
              -DCMAKE_TOOLCHAIN_FILE="$VCC_VCPKG/scripts/buildsystems/vcpkg.cmake" \
              -DVCC_BUILD_TESTS=OFF
            node tools/package.mjs build-rel
          } > package.log 2>&1
          status=$?
          tail -n 40 package.log
          sh ci/annotate-fail.sh "$status" "package" package.log
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: vcc-windows-installer
          path: build-rel/installer/*.exe
          if-no-files-found: error

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build-rel/installer/*.exe \
            --verify-tag --title "VCC $GITHUB_REF_NAME" --generate-notes

      - name: Publish the failure log where anyone can read it
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "## installer job, run $GITHUB_RUN_ID ($GITHUB_SHA)";
            for f in install.log package.log; do
              [ -f "$f" ] || continue
              echo "===== $f ====="; tail -n 150 "$f"
            done; } > digest.md
          head -c 55000 digest.md > digest-body.md
          gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@digest-body.md > /dev/null && echo "failure log posted as a commit comment"

      - name: Attach the step logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: installer-job-logs
          path: |
            install.log
            package.log
